<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Color Studio</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>

    <main class="container">

        <p class="label">COLOR GENERATOR</p>

        <h1>Color Studio</h1>

        <p class="subtitle">
            Generate, explore and copy random colors.
        </p>


        <section class="color-card">

            <div class="color-preview" id="colorPreview"></div>

            <div class="color-information">

                <h2 id="colorCode">#FFFFFF</h2>

                <p id="rgbValue">
                    RGB: 255, 255, 255
                </p>

                <p id="hslValue">
                    HSL: 0°, 0%, 100%
                </p>

            </div>

        </section>


        <div class="buttons">

            <button id="generateBtn">
                Generate Color
            </button>

            <button id="copyBtn">
                Copy HEX
            </button>

        </div>


        <p class="message" id="message">
            Click "Generate Color" to begin.
        </p>


        <section class="history-section">

            <h3>Recent Colors</h3>

            <div class="history" id="history"></div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
